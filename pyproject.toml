[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-ai-toolkit"
version = "0.1.0"
description = "A lightweight Python toolkit for interacting with local AI models through Ollama."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Shashank Naik" }
]
keywords = [
    "ai",
    "ollama",
    "llm",
    "local-ai",
    "python",
    "cli"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://github.com/shashanknaik808/open-ai-toolkit"
Repository = "https://github.com/shashanknaik808/open-ai-toolkit"
Issues = "https://github.com/shashanknaik808/open-ai-toolkit/issues"

[project.scripts]
open-ai-toolkit = "app:main"

[tool.setuptools]
py-modules = ["app"]
